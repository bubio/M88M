name: Build Haiku (x86_64)

on:
  push:
    branches: [ main, master, codex/haiku-build-experiment ]
    paths:
      - 'CMakeLists.txt'
      - 'LICENSE'
      - 'assets/**'
      - 'src/**'
      - 'scripts/build_haiku.sh'
      - 'scripts/prepare_haiku_app.sh'
      - 'scripts/create_haiku_package.sh'
      - '.github/workflows/build-haiku.yml'
      - '.github/workflows/publish-release-assets.yml'
  pull_request:
    branches: [ main, master, codex/haiku-build-experiment ]
    paths:
      - 'CMakeLists.txt'
      - 'LICENSE'
      - 'assets/**'
      - 'src/**'
      - 'scripts/build_haiku.sh'
      - 'scripts/prepare_haiku_app.sh'
      - 'scripts/create_haiku_package.sh'
      - '.github/workflows/build-haiku.yml'
      - '.github/workflows/publish-release-assets.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
    - uses: actions/checkout@v7

    - name: Start Haiku VM
      uses: cross-platform-actions/action@v1.3.0
      with:
        operating_system: haiku
        architecture: x86-64
        version: 'r1beta5'
        shell: bash
        memory: 6G
        cpu_count: 4

    - name: Install dependencies
      run: |
        pkgman install -y cmake git pkgconfig
        pkgman install -y libiconv_devel || true
        pkgman install -y libsdl2_devel || pkgman install -y sdl2_devel
        pkgman install -y nfd_devel || pkgman install -y nfd

    - name: Build
      run: |
        sh scripts/build_haiku.sh

    - name: Stage app
      run: |
        rm -rf dist/m88m-haiku-x64
        mkdir -p dist/m88m-haiku-x64/licenses
        cp build/m88m dist/m88m-haiku-x64/
        sh scripts/prepare_haiku_app.sh dist/m88m-haiku-x64/m88m assets/AppIcon.png
        cp LICENSE dist/m88m-haiku-x64/
        cp assets/NOTICE.md dist/m88m-haiku-x64/licenses/
        cp assets/OFL.txt dist/m88m-haiku-x64/licenses/

    - name: Create HPKG
      run: |
        sh scripts/create_haiku_package.sh build/m88m dist/m88m-1.2.0-haiku-x64.hpkg 1.2.0 1

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: m88m-haiku-x64-app
        path: dist/m88m-haiku-x64

    - name: Upload HPKG
      uses: actions/upload-artifact@v7
      with:
        name: m88m-haiku-x64-hpkg
        path: dist/m88m-1.2.0-haiku-x64.hpkg

  publish-release:
    if: github.event_name == 'release'
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
    with:
      zip-artifacts: |
        m88m-haiku-x64-app=m88m-{version}-haiku-x64.zip
        m88m-haiku-x64-hpkg=m88m-{version}-haiku-x64-hpkg.zip
