name: Publish Release Assets

on:
  workflow_call:
    inputs:
      asset-patterns:
        description: Newline-separated filename globs to upload as release assets.
        required: false
        default: ""
        type: string
      zip-artifacts:
        description: Newline-separated artifact=zip-file mappings to zip before upload.
        required: false
        default: ""
        type: string
      executable-paths:
        description: |
          Newline-separated filename globs inside zipped artifacts that must keep the
          execute bit. actions/upload-artifact drops file modes, so the bit has to be
          restored here before the archive is created.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Determine version
      id: ver
      run: |
        VERSION="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Download Release Artifacts
      uses: actions/download-artifact@v8
      with:
        path: release-assets

    - name: Upload Release Assets
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        ASSET_PATTERNS: ${{ inputs.asset-patterns }}
        ZIP_ARTIFACTS: ${{ inputs.zip-artifacts }}
        EXECUTABLE_PATHS: ${{ inputs.executable-paths }}
        VERSION: ${{ steps.ver.outputs.version }}
      run: |
        if [ -z "$RELEASE_TAG" ]; then
          echo "Release tag is not available."
          exit 1
        fi

        mkdir -p release-upload
        # A single downloaded artifact can be extracted directly into release-assets/
        # instead of release-assets/<artifact-name>/.
        zip_mapping_count="$(printf '%s\n' "$ZIP_ARTIFACTS" | sed '/^[[:space:]]*$/d' | wc -l)"

        while IFS= read -r mapping; do
          [ -z "$mapping" ] && continue
          artifact_name="${mapping%%=*}"
          zip_name="${mapping#*=}"
          # Allow callers to embed the project version via a {version} token.
          zip_name="${zip_name//\{version\}/$VERSION}"
          artifact_dir="release-assets/$artifact_name"

          if [ "$artifact_name" = "$zip_name" ] || [ -z "$artifact_name" ] || [ -z "$zip_name" ]; then
            echo "Invalid zip artifact mapping: $mapping"
            exit 1
          fi
          if [ ! -d "$artifact_dir" ]; then
            has_single_mapping=false
            release_assets_exists=false
            release_assets_not_empty=false
            [ "$zip_mapping_count" -eq 1 ] && has_single_mapping=true
            [ -d release-assets ] && release_assets_exists=true
            [ "$release_assets_exists" = true ] && find release-assets -mindepth 1 -print -quit | grep -q . && release_assets_not_empty=true

            if [ "$has_single_mapping" = true ] && [ "$release_assets_exists" = true ] && [ "$release_assets_not_empty" = true ]; then
              artifact_dir="release-assets"
            else
              echo "Artifact directory not found: $artifact_dir"
              exit 1
            fi
          fi

          while IFS= read -r exec_pattern; do
            [ -z "$exec_pattern" ] && continue
            find "$artifact_dir" -type f -name "$exec_pattern" -exec chmod +x {} +
          done <<< "$EXECUTABLE_PATHS"

          output_zip="$(pwd)/release-upload/$zip_name"
          (cd "$artifact_dir" && zip -r "$output_zip" .)
        done <<< "$ZIP_ARTIFACTS"

        mapfile -t all_files < <(find release-assets -type f -print)
        assets=()

        while IFS= read -r pattern; do
          [ -z "$pattern" ] && continue
          for file in "${all_files[@]}"; do
            filename="$(basename "$file")"
            # shellcheck disable=SC2254
            case "$filename" in
              $pattern) assets+=("$file") ;;
            esac
          done
        done <<< "$ASSET_PATTERNS"

        mapfile -t zip_files < <(find release-upload -type f -name '*.zip' -print)
        assets+=("${zip_files[@]}")

        if [ "${#assets[@]}" -eq 0 ]; then
          echo "No release assets found."
          exit 1
        fi

        gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
